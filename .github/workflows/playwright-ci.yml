name: Playwright CI

# Starts the real NovaBank (Docker Compose: Postgres, Django API, Angular on nginx, Mailpit)
# and runs the UI suite against it in Chromium and Firefox.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      novabank_ref:
        description: novabank tag, branch or commit to test
        default: v1.1.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # A released version by default: a red build then means the tests changed, not the bank.
      NOVABANK_REF: ${{ inputs.novabank_ref || 'v1.1.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out NovaBank (${{ env.NOVABANK_REF }})
        uses: actions/checkout@v4
        with:
          repository: HrishiPurandare/novabank
          ref: ${{ env.NOVABANK_REF }}
          path: novabank

      - name: Start the bank
        working-directory: novabank
        run: |
          echo "DJANGO_SECRET_KEY=$(openssl rand -base64 48 | tr -d '\n/+=')" > .env
          docker compose up --build --wait --wait-timeout 300

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run the UI suite
        run: npx playwright test

      - name: Upload the HTML report (traces, screenshots, videos of failures)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Bank logs
        if: failure()
        working-directory: novabank
        run: docker compose logs --no-color --tail 200

      - name: Stop the bank
        if: always()
        working-directory: novabank
        run: docker compose down -v
